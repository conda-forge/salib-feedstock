{% set version = "1.6.0" %}

package:
  name: salib
  version: {{ version }}
source:
  fn: SALib-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/3f/9d/5740846179a70e3771d4465d369bd64de81d773e124440c062728309f8b9/salib-{{ version }}.tar.gz
  sha256: 122d25816137a50b5e972a206de7118961e202a6fb0922d9ec874fd49fdbbf5f
build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv
requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.8.1
  run:
    - python >={{ python_min }}
    - numpy >=2.0
    - pandas >=1.1.2
    - scipy >=1.7.3
    - matplotlib-base
    - pathos >=0.2.5
    - multiprocess
test:
  requires:
    - python {{ python_min }}
  imports:
    - SALib
about:
  home: http://salib.github.io/SALib/
  dev_url: https://github.com/SALib/SALib
  doc_url: http://salib.readthedocs.org
  license: MIT
  license_file: LICENSE.md
  summary: Sensitivity Analysis Library
  description: |
    Python implementations of commonly used sensitivity analysis methods.
    Useful in systems modeling to calculate the effects of model inputs or
    exogenous factors on outputs of interest.

extra:
  recipe-maintainers:
    - jschueller
    - willu47
    - ConnectedSystems
